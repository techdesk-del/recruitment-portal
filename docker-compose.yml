version: '3.8'

services:
  # -------------------------------------------------------------
  # Frontend Web Interface (SPA + Nginx Reverse Proxy with WebSockets)
  # (Port mapped to 3080 to prevent host port collisions with port 3000)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruitment-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------
  # Backend API Gateway & Real-Time Socket.IO Server
  # (Port mapped to 5050 because port 5000 is reserved by Synology DSM UI)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitment-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5050}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/recruitment_dashboard}
      - LOCAL_MONGODB_URI=mongodb://mongo:27017/recruitment_dashboard
      - CLOUD_MONGODB_URI=${CLOUD_MONGODB_URI:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------
  # High-Performance On-Premise MongoDB for Synology DS925+
  # (Port mapped to 27018 to prevent host port collisions on NAS)
  # -------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: recruitment-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-backups:/backups
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.5"]
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------
  # Redis Queue & Real-Time Socket Adapter
  # (Port mapped to 6380 to prevent host port collisions on NAS)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: recruitment-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    networks:
      - recruitment-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  recruitment-network:
    driver: bridge

# Synology Container Manager Auto-Managed Volumes (No manual mkdir required)
volumes:
  mongo-data:
  mongo-backups:
  redis-data:
